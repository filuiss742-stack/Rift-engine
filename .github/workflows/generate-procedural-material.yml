name: Generate procedural material

on:
  push:
    branches:
      - development/0.7.0
    paths:
      - "tools/assets/generation-requests/*.json"
  workflow_dispatch:
    inputs:
      material:
        description: Material family
        required: true
        type: choice
        options: [stone, soil, grass, wood, metal]
      size:
        description: Texture resolution
        required: true
        default: "512"
        type: choice
        options: ["512", "1024", "2048"]
      seed:
        description: Reproducible integer seed
        required: true
        default: "42"
        type: string

permissions:
  contents: read

jobs:
  generate:
    if: github.ref == 'refs/heads/development/0.7.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: development/0.7.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Resolve and validate request
        id: request
        shell: bash
        run: |
          REQUEST_PATH=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            MATERIAL="${{ inputs.material }}"
            SIZE="${{ inputs.size }}"
            SEED="${{ inputs.seed }}"
          else
            REQUEST_PATH="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^tools/assets/generation-requests/[^/]+\.json$' | head -n 1)"
            test -n "$REQUEST_PATH"
            mapfile -t VALUES < <(python - "$REQUEST_PATH" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              request = json.load(source)
          print(request.get("material", ""))
          print(request.get("size", ""))
          print(request.get("seed", ""))
          PY
          )
            MATERIAL="${VALUES[0]}"
            SIZE="${VALUES[1]}"
            SEED="${VALUES[2]}"
          fi

          [[ "$MATERIAL" =~ ^(stone|soil|grass|wood|metal)$ ]]
          [[ "$SIZE" =~ ^(512|1024|2048)$ ]]
          [[ "$SEED" =~ ^[0-9]{1,9}$ ]]
          echo "material=$MATERIAL" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          echo "request_path=$REQUEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate PNG material maps
        run: |
          python tools/assets/generate_procedural_material.py \
            --material "${{ steps.request.outputs.material }}" \
            --size "${{ steps.request.outputs.size }}" \
            --seed "${{ steps.request.outputs.seed }}" \
            --output "app/src/main/assets/generated/material-candidates/${{ steps.request.outputs.material }}-${{ steps.request.outputs.seed }}"

      - name: Validate generated PBR set
        run: |
          python tools/assets/validate_materials.py \
            "app/src/main/assets/generated/material-candidates/${{ steps.request.outputs.material }}-${{ steps.request.outputs.seed }}/material.json"

      - name: Upload generated material candidate to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: rift-${{ steps.request.outputs.material }}-pbr-${{ steps.request.outputs.seed }}
          path: app/src/main/assets/generated/material-candidates/${{ steps.request.outputs.material }}-${{ steps.request.outputs.seed }}/
          if-no-files-found: error
          retention-days: 90

      - name: Write generation summary
        run: |
          echo "## Rift material candidate generated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Material: ${{ steps.request.outputs.material }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resolution: ${{ steps.request.outputs.size }}x${{ steps.request.outputs.size }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seed: ${{ steps.request.outputs.seed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Output: GitHub Actions artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- PBR validation: passed" >> "$GITHUB_STEP_SUMMARY"
