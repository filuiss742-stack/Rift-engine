name: Generate procedural material

on:
  workflow_dispatch:
    inputs:
      material:
        description: Material family
        required: true
        type: choice
        options: [stone, soil, grass, wood, metal]
      size:
        description: Texture resolution
        required: true
        default: "512"
        type: choice
        options: ["512", "1024", "2048"]
      seed:
        description: Reproducible integer seed
        required: true
        default: "42"
        type: string

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/development/0.7.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: development/0.7.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate PNG material maps
        run: |
          python tools/assets/generate_procedural_material.py \
            --material "${{ inputs.material }}" \
            --size "${{ inputs.size }}" \
            --seed "${{ inputs.seed }}" \
            --output "app/src/main/assets/generated/material-candidates/${{ inputs.material }}-${{ inputs.seed }}"

      - name: Validate generated PBR set
        run: |
          python tools/assets/validate_materials.py \
            "app/src/main/assets/generated/material-candidates/${{ inputs.material }}-${{ inputs.seed }}/material.json"

      - name: Commit generated PNG files to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/src/main/assets/generated/material-candidates/${{ inputs.material }}-${{ inputs.seed }}"
          if git diff --cached --quiet; then
            echo "No changes: this material and seed already exist."
          else
            git commit -m "assets: generate ${{ inputs.material }} material candidate (seed ${{ inputs.seed }})"
            git push origin HEAD:development/0.7.0
          fi
