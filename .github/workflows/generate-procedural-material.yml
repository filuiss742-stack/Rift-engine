name: Generate procedural material

on:
  push:
    branches:
      - development/0.7.0
    paths:
      - "tools/assets/generation-requests/*.json"
  workflow_dispatch:
    inputs:
      material:
        description: Material family
        required: true
        type: choice
        options: [stone, soil, grass, wood, metal]
      size:
        description: Texture resolution
        required: true
        default: "512"
        type: choice
        options: ["512", "1024", "2048"]
      seed:
        description: Reproducible integer seed
        required: true
        default: "42"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: github.ref == 'refs/heads/development/0.7.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: development/0.7.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Resolve and validate request
        id: request
        shell: bash
        run: |
          REQUEST_PATH=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            MATERIAL="${{ inputs.material }}"
            SIZE="${{ inputs.size }}"
            SEED="${{ inputs.seed }}"
          else
            REQUEST_PATH="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^tools/assets/generation-requests/[^/]+\.json$' | head -n 1)"
            test -n "$REQUEST_PATH"
            mapfile -t VALUES < <(python - "$REQUEST_PATH" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              request = json.load(source)
          print(request.get("material", ""))
          print(request.get("size", ""))
          print(request.get("seed", ""))
          PY
          )
            MATERIAL="${VALUES[0]}"
            SIZE="${VALUES[1]}"
            SEED="${VALUES[2]}"
          fi

          [[ "$MATERIAL" =~ ^(stone|soil|grass|wood|metal)$ ]]
          [[ "$SIZE" =~ ^(512|1024|2048)$ ]]
          [[ "$SEED" =~ ^[0-9]{1,9}$ ]]
          echo "material=$MATERIAL" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          echo "request_path=$REQUEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate PNG material maps
        run: |
          python tools/assets/generate_procedural_material.py \
            --material "${{ steps.request.outputs.material }}" \
            --size "${{ steps.request.outputs.size }}" \
            --seed "${{ steps.request.outputs.seed }}" \
            --output "app/src/main/assets/generated/material-candidates/${{ steps.request.outputs.material }}-${{ steps.request.outputs.seed }}"

      - name: Validate generated PBR set
        run: |
          python tools/assets/validate_materials.py \
            "app/src/main/assets/generated/material-candidates/${{ steps.request.outputs.material }}-${{ steps.request.outputs.seed }}/material.json"

      - name: Remove processed request file
        if: steps.request.outputs.request_path != ''
        run: git rm --ignore-unmatch "${{ steps.request.outputs.request_path }}"

      - name: Open asset candidate pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: development/0.7.0
          branch: generated/material-${{ steps.request.outputs.material }}-${{ steps.request.outputs.seed }}
          delete-branch: true
          commit-message: "assets: generate ${{ steps.request.outputs.material }} material candidate (seed ${{ steps.request.outputs.seed }})"
          title: "Generated ${{ steps.request.outputs.material }} material candidate"
          body: |
            Automated procedural PBR candidate generated by Rift Asset Generator.
            - Material: ${{ steps.request.outputs.material }}
            - Resolution: ${{ steps.request.outputs.size }}x${{ steps.request.outputs.size }}
            - Seed: ${{ steps.request.outputs.seed }}
            - Maps: base color, normal, roughness, metallic, height
            - Manifest validated by tools/assets/validate_materials.py

            This is a candidate asset. Review the images visually and test in the target renderer before promoting it to production assets.
          add-paths: |
            app/src/main/assets/generated/material-candidates/${{ steps.request.outputs.material }}-${{ steps.request.outputs.seed }}/
