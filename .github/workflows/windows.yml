name: Windows Desktop and Runtime Smoke Test

on:
  push:
    branches:
      - main
      - "development/**"
      - "fix/**"
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - "development/**"
      - "fix/**"
      - "feature/**"
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download real CC0 PNG material textures
        shell: bash
        run: bash tools/assets/fetch_cc0_materials.sh
      - name: Check engine platform boundaries
        run: python scripts/check_engine_boundaries.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run all shared JVM tests
        run: gradle :engine:test :demo-game:test :platform-desktop:test :tools:project-validator:test :gdx-spike:core:test
      - name: Build isolated libGDX desktop spike
        run: gradle :gdx-spike:desktop:build
      - name: Validate sample project manifest
        run: gradle :tools:project-validator:run --args="examples/ai-game/rift.project.json"
      - name: Validate Kotlin game template manifest
        run: gradle :tools:project-validator:run --args="templates/kotlin-game/rift.project.json"
      - name: Publish engine to local Maven repository for template test
        run: gradle :engine:publishToMavenLocal
      - name: Test game template independently
        working-directory: templates/kotlin-game
        run: gradle test
      - name: Test independent AI game acceptance project
        working-directory: examples/ai-game
        run: gradle test build
      - name: Build desktop distribution
        run: gradle :desktop-app:installDist
      - name: Package Windows app image
        shell: pwsh
        run: |
          $mainJar = Get-ChildItem desktop-app/build/install/desktop-app/lib -Filter "desktop-app*.jar" | Select-Object -First 1
          if (-not $mainJar) { throw "Desktop application JAR was not found in the install distribution." }
          jpackage --type app-image --name RiftEngine --input desktop-app/build/install/desktop-app/lib --main-jar $mainJar.Name --main-class com.rift.engine.desktop.MainKt --dest build/windows
      - name: Launch packaged EXE and capture runtime evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/autotest | Out-Null
          $exe = (Resolve-Path "build/windows/RiftEngine/RiftEngine.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $process.Refresh()
          if ($process.HasExited) {
            throw "RiftEngine.exe exited during the 15-second runtime smoke test (exit code $($process.ExitCode))."
          }
          Get-Process -Id $process.Id | Select-Object Id, ProcessName, CPU, WorkingSet64, StartTime |
            Format-List | Out-File build/autotest/process.txt
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save((Join-Path (Resolve-Path "build/autotest").Path "desktop-smoke.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bitmap.Dispose()
          Stop-Process -Id $process.Id -Force
      - name: Upload Windows runtime smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-windows-autotest
          path: build/autotest/
          if-no-files-found: warn
      - name: Upload Windows app image
        uses: actions/upload-artifact@v4
        with:
          name: rift-engine-windows
          path: build/windows/RiftEngine
          if-no-files-found: error
