name: Android APK and Emulator AutoTest

on:
  push:
    branches:
      - main
      - "development/**"
      - "fix/**"
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - "development/**"
      - "fix/**"
      - "feature/**"
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download real CC0 PNG material textures
        shell: bash
        run: bash tools/assets/fetch_cc0_materials.sh
      - name: Check engine platform boundaries
        run: python scripts/check_engine_boundaries.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run all shared JVM tests
        run: gradle :engine:test :demo-game:test :platform-desktop:test :tools:project-validator:test
      - name: Validate sample project manifest
        run: gradle :tools:project-validator:run --args="examples/ai-game/rift.project.json"
      - name: Validate Kotlin game template manifest
        run: gradle :tools:project-validator:run --args="templates/kotlin-game/rift.project.json"
      - name: Publish engine to local Maven repository for template test
        run: gradle :engine:publishToMavenLocal
      - name: Test game template independently
        working-directory: templates/kotlin-game
        run: gradle test
      - name: Test independent AI game acceptance project
        working-directory: examples/ai-game
        run: gradle test build
      - name: Android lint
        run: gradle :platform-android:lintDebug :app:lintDebug
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Run APK on Android emulator (launch, render, screenshot, frame metrics)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Hosted Linux runners may not expose KVM; explicitly allow the emulator's TCG fallback.
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 512
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          script: |
            set +e
            gradle :app:connectedDebugAndroidTest
            test_status=$?
            mkdir -p build/autotest
            adb logcat -d -v threadtime > build/autotest/logcat.txt
            adb shell dumpsys gfxinfo com.rift.engine.demo framestats > build/autotest/gfxinfo-framestats.txt
            adb shell dumpsys meminfo com.rift.engine.demo > build/autotest/meminfo.txt
            adb pull /sdcard/Android/data/com.rift.engine.demo/files/rift-autotest/prologue-launch.png build/autotest/prologue-launch.png || true
            exit $test_status
      - name: Upload Android AutoTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-android-autotest
          path: |
            build/autotest/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
