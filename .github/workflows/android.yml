name: Android APK

on:
  push:
    branches:
      - main
      - "development/**"
      - "fix/**"
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - "development/**"
      - "fix/**"
      - "feature/**"
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install texture validation dependency
        run: python -m pip install Pillow
      - name: Test material texture validator
        run: python -m unittest discover -s tools/assets -p "test_validate_materials.py"
      - name: Check engine platform boundaries
        run: python scripts/check_engine_boundaries.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run all shared JVM tests
        run: gradle :engine:test :demo-game:test :platform-desktop:test :tools:project-validator:test
      - name: Validate sample project manifest
        run: gradle :tools:project-validator:run --args="examples/ai-game/rift.project.json"
      - name: Validate Kotlin game template manifest
        run: gradle :tools:project-validator:run --args="templates/kotlin-game/rift.project.json"
      - name: Publish engine to local Maven repository for template test
        run: gradle :engine:publishToMavenLocal
      - name: Test game template independently
        working-directory: templates/kotlin-game
        run: gradle test
      - name: Test independent AI game acceptance project
        working-directory: examples/ai-game
        run: gradle test build
      - name: Android lint
        run: gradle :platform-android:lintDebug :app:lintDebug
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rift-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
