name: Asset tools CI

on:
  push:
    branches:
      - development/0.7.0
    paths:
      - "tools/assets/**"
      - ".github/workflows/asset-tools-ci.yml"
  pull_request:
    paths:
      - "tools/assets/**"
      - ".github/workflows/asset-tools-ci.yml"

permissions:
  contents: read

jobs:
  asset-tools-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run asset pipeline unit tests
        run: python -m unittest discover -s tools/assets -p "test_*.py" -v
