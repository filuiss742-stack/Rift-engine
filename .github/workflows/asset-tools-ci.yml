name: CC0 Material Assets CI

on:
  push:
    branches:
      - development/0.7.0
      - "feature/**"
    paths:
      - "tools/assets/fetch_cc0_materials.sh"
      - ".github/workflows/asset-tools-ci.yml"
  pull_request:
    paths:
      - "tools/assets/fetch_cc0_materials.sh"
      - ".github/workflows/asset-tools-ci.yml"

permissions:
  contents: read

jobs:
  cc0-material-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download real CC0 PNG material textures
        shell: bash
        run: bash tools/assets/fetch_cc0_materials.sh

      - name: Verify downloaded PNG assets
        shell: bash
        run: |
          set -euo pipefail
          for file in app/src/main/assets/prologue/materials/*.png; do
            signature="$(od -An -tx1 -N8 "$file" | tr -d ' \n')"
            test "$signature" = "89504e470d0a1a0a"
            echo "OK: $file ($(wc -c < "$file") bytes)"
          done
          test -f app/src/main/assets/prologue/materials/CC0_SOURCES.txt

      - name: Upload CC0 material preview package
        uses: actions/upload-artifact@v4
        with:
          name: rift-cc0-material-pngs
          path: app/src/main/assets/prologue/materials/
          if-no-files-found: error
